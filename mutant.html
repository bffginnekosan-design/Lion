<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獅子奮迅 ミュータント</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 20px auto; padding: 15px; display: none; font-size: 18px; }
    h2 { font-size: 1.4em; }
    .section-title { font-weight: bold; font-size: 1.25em; margin-top: 20px; margin-bottom: 12px; padding-bottom: 6px; }
    .title-naisei { color: #28a745; border-bottom: 3px solid #28a745; }
    .title-gunji { color: #dc3545; border-bottom: 3px solid #dc3545; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 1em; font-weight: bold; margin-bottom: 6px; color: #333; }
    input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:hover { background-color: #0056b3; }
    #result { margin-top: 20px; padding: 15px; font-size: 1em; font-weight: bold; border-radius: 6px; line-height: 1.6; }
    .pass { background-color: #d4edda; color: #155724; }
    .fail { background-color: #f8d7da; color: #721c24; }
    .advice { margin-top: 10px; font-weight: normal; font-size: 0.9em; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>獅子奮迅 ミュータント</h2>

  <div class="section-title title-naisei">内政</div>
  <div class="input-group">
    <label for="naisei_500">500pt</label>
    <input type="number" id="naisei_500" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="naisei_2000">2000pt</label>
    <input type="number" id="naisei_2000" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="naisei_10000">10000pt</label>
    <input type="number" id="naisei_10000" placeholder="0" min="0">
  </div>

  <div class="section-title title-gunji">軍事</div>
  <div class="input-group">
    <label for="gunji_500">500pt</label>
    <input type="number" id="gunji_500" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="gunji_2000">2000pt</label>
    <input type="number" id="gunji_2000" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="gunji_10000">10000pt</label>
    <input type="number" id="gunji_10000" placeholder="0" min="0">
  </div>

  <button onclick="calculate()">判定する</button>

  <div id="result"></div>

  <script>
    // パスワード設定（「44」）
    const PASSWORD = "44";

    window.onload = function() {
      const userInput = prompt("パスワードを入力してください:");
      if (userInput === PASSWORD) {
        document.body.style.display = "block";
      } else {
        alert("パスワードが違います。");
        document.body.innerHTML = "<h3>アクセス権限がありません</h3>";
        document.body.style.display = "block";
      }
    };

    function calculate() {
      const getValue = (id) => {
        const val = document.getElementById(id).value;
        const num = Number(val);
        return isNaN(num) ? 0 : num;
      };

      const n500 = getValue('naisei_500');
      const n2000 = getValue('naisei_2000');
      const n10000 = getValue('naisei_10000');

      const g500 = getValue('gunji_500');
      const g2000 = getValue('gunji_2000');
      const g10000 = getValue('gunji_10000');

      const totalScore = ((n500 + g500) * 100) + 
                         ((n2000 + g2000) * 400) + 
                         ((n10000 + g10000) * 2000);
      
      const targetScore = 625000;
      const resultDiv = document.getElementById('result');

      if (totalScore >= targetScore) {
        const overScore = totalScore - targetScore;

        let msg = `合計: ${totalScore.toLocaleString()} 点<br>625,000点に到達しています！`;

        if (overScore > 0) {
          // 削れる数の計算（内政・軍事を合わせた個数）
          const total500 = n500 + g500;
          const total2000 = n2000 + g2000;
          const total10000 = n10000 + g10000;

          let remScore = overScore;
          let reduce500 = 0;
          let reduce2000 = 0;
          let reduce10000 = 0;

          // 大きいpt（10000pt = 2000点）から優先的に削る
          if (total10000 > 0 && remScore >= 2000) {
            reduce10000 = Math.min(total10000, Math.floor(remScore / 2000));
            remScore -= reduce10000 * 2000;
          }
          // 次に2000pt（400点）を削る
          if (total2000 > 0 && remScore >= 400) {
            reduce2000 = Math.min(total2000, Math.floor(remScore / 400));
            remScore -= reduce2000 * 400;
          }
          // 最後に500pt（100点）を削る
          if (total500 > 0 && remScore >= 100) {
            reduce500 = Math.min(total500, Math.floor(remScore / 100));
            remScore -= reduce500 * 100;
          }

          if (reduce500 > 0 || reduce2000 > 0 || reduce10000 > 0) {
            msg += `<div class="advice">`;
            if (reduce10000 > 0) msg += `・10000pt ✕ ${reduce10000} 個<br>`;
            if (reduce2000 > 0) msg += `・2000pt ✕ ${reduce2000} 個<br>`;
            if (reduce500 > 0) msg += `・500pt ✕ ${reduce500} 個<br>`;
            msg += `省エネ達成派はこんな感じで減らすとちょーどいい感じ！<br>ランキングを目指すなら全ツッパだ！</div>`;
          }
        }

        resultDiv.className = 'pass';
        resultDiv.innerHTML = msg;

      } else {
        const diffScore = targetScore - totalScore;
        const diffPt = diffScore * 5; // 100pt=20点 (1点=5pt 換算)
        resultDiv.className = 'fail';
        resultDiv.innerHTML = `合計: ${totalScore.toLocaleString()} 点<br>到達していません（あと ${diffPt.toLocaleString()} pt必要）`;
      }
    }
  </script>

</body>
</html>
