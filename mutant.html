<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獅子奮迅 ミュータント</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 20px auto; padding: 15px; font-size: 18px; }
    h2 { font-size: 1.4em; }
    .section-title { font-weight: bold; font-size: 1.25em; margin-top: 20px; margin-bottom: 12px; padding-bottom: 6px; }
    .title-naisei { color: #28a745; border-bottom: 3px solid #28a745; }
    .title-gunji { color: #dc3545; border-bottom: 3px solid #dc3545; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 1em; font-weight: bold; margin-bottom: 6px; color: #333; }
    input { width: 100%; padding: 12px; box-sizing: border-box; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:hover { background-color: #0056b3; }
    #result { margin-top: 20px; padding: 15px; font-size: 1em; font-weight: bold; border-radius: 6px; line-height: 1.6; }
    .pass { background-color: #d4edda; color: #155724; }
    .fail { background-color: #f8d7da; color: #721c24; }
    .advice { margin-top: 10px; font-weight: normal; font-size: 0.9em; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 4px; }
    .pattern-box { background: rgba(255,255,255,0.8); border: 1px solid #BCE8C1; border-radius: 6px; padding: 10px; margin-top: 10px; }
    .pattern-title { font-weight: bold; color: #155724; border-bottom: 1px dashed #28a745; padding-bottom: 4px; margin-bottom: 6px; }
    .sub-title { font-weight: bold; margin-top: 6px; font-size: 0.95em; }
  </style>
</head>
<body>

  <h2>獅子奮迅 ミュータント</h2>

  <!-- 内政 -->
  <div class="section-title title-naisei">内政</div>
  <div class="input-group">
    <label for="naisei_500">500pt</label>
    <input type="number" id="naisei_500" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="naisei_2000">2000pt</label>
    <input type="number" id="naisei_2000" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="naisei_10000">10000pt</label>
    <input type="number" id="naisei_10000" placeholder="0" min="0">
  </div>

  <!-- 軍事 -->
  <div class="section-title title-gunji">軍事</div>
  <div class="input-group">
    <label for="gunji_500">500pt</label>
    <input type="number" id="gunji_500" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="gunji_2000">2000pt</label>
    <input type="number" id="gunji_2000" placeholder="0" min="0">
  </div>
  <div class="input-group">
    <label for="gunji_10000">10000pt</label>
    <input type="number" id="gunji_10000" placeholder="0" min="0">
  </div>

  <button onclick="calculate()">判定する</button>

  <div id="result"></div>

  <script>
    function calculate() {
      const getValue = (id) => {
        const val = document.getElementById(id).value;
        const num = Number(val);
        return isNaN(num) ? 0 : num;
      };

      const n500 = getValue('naisei_500');
      const n2000 = getValue('naisei_2000');
      const n10000 = getValue('naisei_10000');

      const g500 = getValue('gunji_500');
      const g2000 = getValue('gunji_2000');
      const g10000 = getValue('gunji_10000');

      const totalScore = ((n500 + g500) * 100) + 
                         ((n2000 + g2000) * 400) + 
                         ((n10000 + g10000) * 2000);
      
      const targetScore = 625000;
      const resultDiv = document.getElementById('result');

      if (totalScore >= targetScore) {
        let msg = `合計: ${totalScore.toLocaleString()} 点<br>625,000点に到達しています！`;

        if (totalScore > targetScore) {
          // --- 計算関数 (優先順位を受け取って必要数を返す) ---
          const calcPlan = (isNaiseiFirst) => {
            let needScore = targetScore;
            let res = { n10000: 0, n2000: 0, n500: 0, g10000: 0, g2000: 0, g500: 0 };

            // 10000pt (2000点)
            if (isNaiseiFirst) {
              if (needScore > 0 && n10000 > 0) { res.n10000 = Math.min(n10000, Math.ceil(needScore / 2000)); needScore -= res.n10000 * 2000; }
              if (needScore > 0 && g10000 > 0) { res.g10000 = Math.min(g10000, Math.ceil(needScore / 2000)); needScore -= res.g10000 * 2000; }
            } else {
              if (needScore > 0 && g10000 > 0) { res.g10000 = Math.min(g10000, Math.ceil(needScore / 2000)); needScore -= res.g10000 * 2000; }
              if (needScore > 0 && n10000 > 0) { res.n10000 = Math.min(n10000, Math.ceil(needScore / 2000)); needScore -= res.n10000 * 2000; }
            }

            // 2000pt (400点)
            if (isNaiseiFirst) {
              if (needScore > 0 && n2000 > 0) { res.n2000 = Math.min(n2000, Math.ceil(needScore / 400)); needScore -= res.n2000 * 400; }
              if (needScore > 0 && g2000 > 0) { res.g2000 = Math.min(g2000, Math.ceil(needScore / 400)); needScore -= res.g2000 * 400; }
            } else {
              if (needScore > 0 && g2000 > 0) { res.g2000 = Math.min(g2000, Math.ceil(needScore / 400)); needScore -= res.g2000 * 400; }
              if (needScore > 0 && n2000 > 0) { res.n2000 = Math.min(n2000, Math.ceil(needScore / 400)); needScore -= res.n2000 * 400; }
            }

            // 500pt (100点)
            if (isNaiseiFirst) {
              if (needScore > 0 && n500 > 0) { res.n500 = Math.min(n500, Math.ceil(needScore / 100)); needScore -= res.n500 * 100; }
              if (needScore > 0 && g500 > 0) { res.g500 = Math.min(g500, Math.ceil(needScore / 100)); needScore -= res.g500 * 100; }
            } else {
              if (needScore > 0 && g500 > 0) { res.g500 = Math.min(g500, Math.ceil(needScore / 100)); needScore -= res.g500 * 100; }
              if (needScore > 0 && n500 > 0) { res.n500 = Math.min(n500, Math.ceil(needScore / 100)); needScore -= res.n500 * 100; }
            }

            return res;
          };

          const planNaisei = calcPlan(true);  // 内政優先
          const planGunji = calcPlan(false);  // 軍事優先

          // 表示用のHTML生成関数
          const renderPlanHTML = (planTitle, plan) => {
            const hasNaisei = (plan.n10000 > 0 || plan.n2000 > 0 || plan.n500 > 0);
            const hasGunji = (plan.g10000 > 0 || plan.g2000 > 0 || plan.g500 > 0);

            let html = `<div class="pattern-box">`;
            html += `<div class="pattern-title">${planTitle}</div>`;

            if (hasNaisei) {
              html += `<div class="sub-title">【内政】</div>`;
              if (plan.n10000 > 0) html += `・10000pt ✕ ${plan.n10000} 個<br>`;
              if (plan.n2000 > 0) html += `・2000pt ✕ ${plan.n2000} 個<br>`;
              if (plan.n500 > 0) html += `・500pt ✕ ${plan.n500} 個<br>`;
            }

            if (hasGunji) {
              html += `<div class="sub-title">【軍事】</div>`;
              if (plan.g10000 > 0) html += `・10000pt ✕ ${plan.g10000} 個<br>`;
              if (plan.g2000 > 0) html += `・2000pt ✕ ${plan.g2000} 個<br>`;
              if (plan.g500 > 0) html += `・500pt ✕ ${plan.g500} 個<br>`;
            }

            html += `</div>`;
            return html;
          };

          msg += `<div class="advice">`;
          msg += renderPlanHTML("🟢 内政優先パターン", planNaisei);
          msg += renderPlanHTML("🔴 軍事優先パターン", planGunji);
          msg += `<br>省エネ達成派はこんな感じにするとちよーどいい感じ！<br>ランキングを目指すなら全ツッパだ！</div>`;
        }

        resultDiv.className = 'pass';
        resultDiv.innerHTML = msg;

      } else {
        const diffScore = targetScore - totalScore;
        const diffPt = diffScore * 5; // 100pt=20点 (1点=5pt 換算)
        resultDiv.className = 'fail';
        resultDiv.innerHTML = `合計: ${totalScore.toLocaleString()} 点<br>到達していません（あと ${diffPt.toLocaleString()} pt必要）`;
      }
    }
  </script>

</body>
</html>
